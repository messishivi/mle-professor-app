[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-professor"
version = "0.1.0"
description = "Personal Machine Learning knowledge base and interview prep app."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # runtime closure of `uvicorn api:app`
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "groq>=1.0",
    "anthropic>=0.30",
    "pydantic>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # mle_professor extras (lazy imports: embeddings, RAG, ingest)
    "openai>=1.50",
    "lancedb>=0.21; python_version>='3.10'",
    "pyarrow>=15; python_version>='3.10'",
    "sentence-transformers>=2.2",
    "pypdf>=4.0",
    "arxiv>=2.1",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mle_professor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
